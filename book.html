<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>کتاب | کتابخانه علمی حوزه</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f6f4ef;
    color: #222;
}

header {
    background: #173f2b;
    color: white;
    padding: 20px;
}

.header {
    max-width: 1100px;
    margin: auto;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 50px 20px;
}

.book-header {
    background: white;
    padding: 30px;
    border-radius: 15px;
    margin-bottom: 30px;
    border: 1px solid #ddd;
}

.book-header h1 {
    color: #173f2b;
    margin-top: 0;
}

.book-header p {
    color: #777;
    line-height: 2;
}

.sections {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.section {
    background: white;
    padding: 25px;
    border-radius: 12px;
    border: 1px solid #ddd;
    text-align: center;
    cursor: pointer;
}

.section:hover {
    background: #f0f5f1;
}

.section h3 {
    color: #173f2b;
}

.content {
    background: white;
    padding: 30px;
    border-radius: 15px;
    border: 1px solid #ddd;
}

.content h2 {
    color: #173f2b;
}

#bookStructure {
    line-height: 2.2;
}

.volume,
.stage,
.chapter,
.lesson {
    margin: 10px 0;
    padding: 12px 15px;
    background: #f5f7f5;
    border-radius: 8px;
}

.stage {
    margin-right: 25px;
}

.chapter {
    margin-right: 50px;
}

.lesson {
    margin-right: 75px;
    cursor: pointer;
}

.lesson:hover {
    background: #e8f0ea;
}

@media(max-width:800px) {
    .sections {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="header">
        <div class="logo">
            📚 کتابخانه علمی حوزه
        </div>
    </div>
</header>

<main>

    <div class="book-header">
        <h1 id="bookTitle">در حال بارگذاری...</h1>
        <p id="bookAuthor"></p>
        <p id="bookDescription"></p>
    </div>

    <div class="sections">

        <div class="section">
            <div>📖</div>
            <h3>مطالعه کتاب</h3>
        </div>

        <div class="section">
            <div>📘</div>
            <h3>شرح</h3>
        </div>

        <div class="section">
            <div>📝</div>
            <h3>تلخیص</h3>
        </div>

        <div class="section">
            <div>📒</div>
            <h3>جزوه</h3>
        </div>

    </div>

    <div class="content">

        <h2>
            ساختار کتاب
        </h2>

        <div id="bookStructure">
            در حال بارگذاری ساختار کتاب...
        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://gsuzmbwjoojzblawgwux.supabase.co";

const SUPABASE_KEY = "sb_publishable_Bj-oXGJ87MDPK6ElWFtE7Q__eHYc95W";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const params = new URLSearchParams(window.location.search);

const bookId = params.get("id");

async function loadBook() {

    if (!bookId) {
        document.getElementById("bookTitle").textContent =
            "شناسه کتاب پیدا نشد";
        return;
    }

    const { data: book, error } = await supabaseClient
        .from("books")
        .select("*")
        .eq("id", bookId)
        .single();

    if (error) {
        console.error(error);

        document.getElementById("bookTitle").textContent =
            "خطا در دریافت کتاب";

        return;
    }

    document.getElementById("bookTitle").textContent =
        book.title || "";

    document.getElementById("bookAuthor").textContent =
        book.author || "";

    document.getElementById("bookDescription").textContent =
        book.description || "";

    loadVolumes();
}

async function loadVolumes() {

    const { data: volumes, error } = await supabaseClient
        .from("volumes")
        .select("*")
        .eq("book_id", bookId)
        .order("volume_number");

    if (error) {
        console.error(error);
        return;
    }

    const container =
        document.getElementById("bookStructure");

    container.innerHTML = "";

    if (!volumes || volumes.length === 0) {
        container.innerHTML =
            "هنوز جلدی برای این کتاب ثبت نشده است.";
        return;
    }

    for (const volume of volumes) {

        const volumeElement =
            document.createElement("div");

        volumeElement.className = "volume";

        volumeElement.innerHTML = `
            📖 ${volume.title || "جلد " + volume.volume_number}
        `;

        container.appendChild(volumeElement);

        loadStages(volume.id, container);
    }
}

async function loadStages(volumeId, container) {

    const { data: stages, error } = await supabaseClient
        .from("stages")
        .select("*")
        .eq("volume_id", volumeId)
        .order("stage_number");

    if (error) {
        console.error(error);
        return;
    }

    for (const stage of stages || []) {

        const stageElement =
            document.createElement("div");

        stageElement.className = "stage";

        stageElement.innerHTML = `
            📚 ${stage.title}
        `;

        container.appendChild(stageElement);

        loadChapters(stage.id, container);
    }
}

async function loadChapters(stageId, container) {

    const { data: chapters, error } = await supabaseClient
        .from("chapters")
        .select("*")
        .eq("stage_id", stageId)
        .order("chapter_number");

    if (error) {
        console.error(error);
        return;
    }

    for (const chapter of chapters || []) {

        const chapterElement =
            document.createElement("div");

        chapterElement.className = "chapter";

        chapterElement.innerHTML = `
            📑 ${chapter.title}
        `;

        container.appendChild(chapterElement);

        loadLessons(chapter.id, container);
    }
}

async function loadLessons(chapterId, container) {

    const { data: lessons, error } = await supabaseClient
        .from("lessons")
        .select("*")
        .eq("chapter_id", chapterId)
        .order("id");

    if (error) {
        console.error(error);
        return;
    }

    for (const lesson of lessons || []) {

        const lessonElement =
            document.createElement("div");

        lessonElement.className = "lesson";

        lessonElement.innerHTML = `
            📌 ${lesson.title_text || ""}
        `;

        container.appendChild(lessonElement);
    }
}

loadBook();

</script>

</body>
</html>
