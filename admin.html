<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f4f6f4;
    color: #222;
}

.sidebar {
    position: fixed;
    right: 0;
    top: 0;
    width: 240px;
    height: 100vh;
    background: #173f2b;
    color: white;
    padding: 25px 15px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 40px;
}

.menu a {
    display: block;
    color: #dce9e1;
    text-decoration: none;
    padding: 14px;
    margin-bottom: 5px;
    border-radius: 8px;
}

.menu a:hover,
.menu a.active {
    background: #286044;
    color: white;
}

.main {
    margin-right: 240px;
    padding: 35px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.top h1 {
    margin: 0;
    color: #173f2b;
}

.home {
    background: white;
    color: #173f2b;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 30px;
}

.stat {
    background: white;
    padding: 25px;
    border-radius: 12px;
    border: 1px solid #ddd;
}

.stat span {
    display: block;
    color: #777;
    font-size: 13px;
}

.stat strong {
    display: block;
    font-size: 28px;
    color: #173f2b;
    margin-top: 8px;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 12px;
    border: 1px solid #ddd;
    margin-bottom: 25px;
}

.panel h2 {
    margin-top: 0;
    color: #173f2b;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.button {
    border: none;
    background: #f1f5f2;
    padding: 20px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    color: #173f2b;
}

.button:hover {
    background: #e3ece6;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 14px;
    border-bottom: 1px solid #eee;
    text-align: right;
}

th {
    color: #173f2b;
}

.badge {
    background: #e4f0e8;
    color: #236044;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 11px;
}

@media(max-width:800px) {

    .sidebar {
        position: static;
        width: 100%;
        height: auto;
    }

    .main {
        margin-right: 0;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .buttons {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<tbody id="booksTableBody">

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gsuzmbwjoojzblawgwux.supabase.co";
const SUPABASE_KEY = "sb_publishable_Bj-oXGJ87MDPK6ElWFtE7Q__eHYc95W";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
</script>
    <div id="bookModal" style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:9999;
    padding:30px;
    overflow:auto;
">

    <div style="
        max-width:650px;
        margin:30px auto;
        background:white;
        padding:30px;
        border-radius:15px;
    ">

        <h2 style="color:#173f2b;">
            افزودن کتاب
        </h2>

        <label>نام کتاب</label>
        <input id="bookTitle" type="text"
            style="width:100%;padding:12px;margin:8px 0 15px;">

        <label>نام مؤلف</label>
        <input id="bookAuthor" type="text"
            style="width:100%;padding:12px;margin:8px 0 15px;">

        <label>توضیحات</label>
        <textarea id="bookDescription"
            style="width:100%;height:120px;padding:12px;margin:8px 0 15px;"></textarea>

        <label>رشته</label>
        <input id="bookCategory" type="text"
            placeholder="مثلاً اصول فقه"
            style="width:100%;padding:12px;margin:8px 0 15px;">

        <button onclick="saveBook()" style="
            background:#173f2b;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
        ">
            ذخیره کتاب
        </button>

        <button onclick="closeBookModal()" style="
            background:#ddd;
            color:#222;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
            margin-right:10px;
        ">
            انصراف
        </button>

    </div>

</div>
 <script>
let editingBookId = null;

function addBook() {
    editingBookId = null;

    document.getElementById("bookTitle").value = "";
    document.getElementById("bookAuthor").value = "";
    document.getElementById("bookDescription").value = "";
    document.getElementById("bookCategory").value = "";

    document.getElementById("bookModal").style.display = "block";
}

function closeBookModal() {
    document.getElementById("bookModal").style.display = "none";
    editingBookId = null;
}

async function saveBook() {
    const title = document.getElementById("bookTitle").value.trim();
    const author = document.getElementById("bookAuthor").value.trim();
    const description = document.getElementById("bookDescription").value.trim();
    const category = document.getElementById("bookCategory").value.trim();

    if (!title) {
        alert("لطفاً نام کتاب را وارد کنید.");
        return;
    }

    // پیدا کردن یا ایجاد دسته‌بندی
    let categoryId;

    const { data: existingCategory, error: categoryFindError } =
        await supabaseClient
            .from("categories")
            .select("id")
            .eq("name", category || "عمومی")
            .maybeSingle();

    if (categoryFindError) {
        alert("خطا در دریافت دسته‌بندی: " + categoryFindError.message);
        return;
    }

    if (existingCategory) {
        categoryId = existingCategory.id;
    } else {
        const { data: newCategory, error: categoryError } =
            await supabaseClient
                .from("categories")
                .insert({
                    name: category || "عمومی"
                })
                .select()
                .single();

        if (categoryError) {
            alert("خطا در ایجاد دسته‌بندی: " + categoryError.message);
            return;
        }

        categoryId = newCategory.id;
    }

    let error;

    if (editingBookId) {

        const result = await supabaseClient
            .from("books")
            .update({
                title: title,
                author: author,
                description: description,
                category_id: categoryId,
                published: true
            })
            .eq("id", editingBookId);

        error = result.error;

    } else {

        const result = await supabaseClient
            .from("books")
            .insert({
                title: title,
                author: author,
                description: description,
                category_id: categoryId,
                published: true
            });

        error = result.error;
    }

    if (error) {
        alert("خطا در ذخیره کتاب: " + error.message);
        return;
    }

    alert(
        editingBookId
            ? "کتاب با موفقیت ویرایش شد. ✅"
            : "کتاب با موفقیت ذخیره شد. ✅"
    );

    closeBookModal();

    loadBooks();
}

async function editBook(id) {

    editingBookId = id;

    const { data, error } = await supabaseClient
        .from("books")
        .select(`
            *,
            categories (
                name
            )
        `)
        .eq("id", id)
        .single();

    if (error) {
        alert("خطا در دریافت کتاب: " + error.message);
        return;
    }

    document.getElementById("bookTitle").value = data.title || "";
    document.getElementById("bookAuthor").value = data.author || "";
    document.getElementById("bookDescription").value = data.description || "";
    document.getElementById("bookCategory").value =
        data.categories?.name || "";

    document.getElementById("bookModal").style.display = "block";
}

async function deleteBook(id) {

    const confirmed = confirm(
        "آیا از حذف این کتاب مطمئن هستید؟"
    );

    if (!confirmed) {
        return;
    }

    const { error } = await supabaseClient
        .from("books")
        .delete()
        .eq("id", id);

    if (error) {
        alert("خطا در حذف کتاب: " + error.message);
        return;
    }

    alert("کتاب با موفقیت حذف شد. ✅");

    loadBooks();
}

async function loadBooks() {

    const { data, error } = await supabaseClient
        .from("books")
        .select(`
            *,
            categories (
                name
            )
        `)
        .order("id", {
            ascending: false
        });

    if (error) {
        console.error(
            "خطا در دریافت کتاب‌ها:",
            error
        );
        return;
    }

    const tbody =
        document.getElementById("booksTableBody");

    tbody.innerHTML = "";

    data.forEach(book => {

        const row =
            document.createElement("tr");

        row.innerHTML = `
            <td>${book.title || ""}</td>

            <td>${book.author || ""}</td>

            <td>
                ${book.categories?.name || "عمومی"}
            </td>

            <td>
                <span class="badge">
                    منتشر شده
                </span>
            </td>

            <td>
                <button
                    onclick="editBook('${book.id}')">
                    ویرایش
                </button>

                <button
                    onclick="deleteBook('${book.id}')">
                    حذف
                </button>
            </td>
        `;

        tbody.appendChild(row);
    });
}

window.addEventListener("load", function () {
    loadBooks();
});
</script>       
</script>
